const INTEGRATIONS = {
  'int.g.erp': ['Pantheon', 'Calculus', 'Lidder', 'SAP', 'Odoo', 'WMS'],
  'int.g.shop': ['Magento', 'WooCommerce', 'Shopify', 'Custom API'],
  'int.g.courier': ['DExpress', 'AKS', 'PostExpress', 'DHL'],
  'int.g.ai': ['n8n', 'REST / SQL', 'Python', 'LLM / RAG', 'OCR / PDF', 'Email / Viber']
};
document.getElementById('intGroups').innerHTML = Object.entries(INTEGRATIONS).map(([k, items]) =>
  `<div><h3 class="font-semibold text-white" data-i18n="${k}"></h3><ul class="mt-4 flex flex-wrap gap-2">${
    items.map(i => `<li class="rounded-md border border-white/10 bg-slate-900/60 px-3 py-1.5 font-mono text-xs text-slate-300">${i}</li>`).join('')
  }</ul></div>`).join('');

const store = {
  get() { try { return localStorage.getItem('lang'); } catch { return null; } },
  set(v) { try { localStorage.setItem('lang', v); } catch {} }
};
let lang;
const t = k => I18N[lang][k] ?? k;

function setLang(next) {
  lang = I18N[next] ? next : 'sr';
  store.set(lang);
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.title = t('meta.title');
  document.querySelector('meta[name="description"]').content = t('meta.desc');
  document.querySelector('meta[property="og:title"]').content = t('meta.title');
  document.querySelector('meta[property="og:description"]').content = t('meta.desc');
  document.querySelectorAll('[data-lang]').forEach(b => {
    const on = b.dataset.lang === lang;
    b.setAttribute('aria-pressed', on);
    b.className = 'rounded px-2 py-1 ' + (on ? 'bg-emerald-500 text-slate-950 font-bold' : 'text-slate-400 hover:text-white');
  });
  document.getElementById('footLang').textContent = t('ft.switch');
  const url = new URL(location.href);
  lang === 'en' ? url.searchParams.set('lang', 'en') : url.searchParams.delete('lang');
  history.replaceState(null, '', url);
}

const urlLang = new URLSearchParams(location.search).get('lang');
setLang(I18N[urlLang] ? urlLang : (store.get() || 'sr'));

document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
document.getElementById('footLang').addEventListener('click', () => setLang(lang === 'sr' ? 'en' : 'sr'));

const menuBtn = document.getElementById('menuBtn'), menu = document.getElementById('mobileMenu');
menuBtn.addEventListener('click', () => {
  const open = menu.classList.toggle('hidden') === false;
  menuBtn.setAttribute('aria-expanded', open);
});
menu.addEventListener('click', e => { if (e.target.closest('a')) { menu.classList.add('hidden'); menuBtn.setAttribute('aria-expanded', false); } });

document.querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(b.dataset.copy); } catch { return; }
  b.textContent = t('ct.copied');
  setTimeout(() => { b.textContent = t('ct.copy'); }, 1500);
}));

const form = document.getElementById('contactForm'), statusEl = document.getElementById('formStatus');
form.addEventListener('submit', async e => {
  e.preventDefault();
  const btn = form.querySelector('[type="submit"]');
  btn.disabled = true; btn.textContent = t('f.sending'); statusEl.textContent = '';
  try {
    const res = await fetch(form.action, { method: 'POST', headers: { Accept: 'application/json' }, body: new FormData(form) });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.success === false) throw new Error(data.message || res.status);
    form.reset();
    statusEl.className = 'min-h-[1.25rem] text-sm text-emerald-400'; statusEl.textContent = t('f.ok');
  } catch {
    statusEl.className = 'min-h-[1.25rem] text-sm text-rose-400'; statusEl.textContent = t('f.err');
  } finally {
    btn.disabled = false; btn.textContent = t('f.submit');
  }
});
